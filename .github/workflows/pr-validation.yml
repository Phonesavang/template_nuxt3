name: PR Validation

# This workflow validates pull requests before they can be merged
# It ensures code quality and runs automated checks

on:
  pull_request:
    branches:
      - main
      - master
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check TypeScript
        run: npx nuxt typecheck
        continue-on-error: true
      
      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: PR Metadata
        run: |
          echo "Pull Request #${{ github.event.pull_request.number }}"
          echo "Author: ${{ github.event.pull_request.user.login }}"
          echo "Title: ${{ github.event.pull_request.title }}"
          echo "Branch: ${{ github.event.pull_request.head.ref }}"
      
      - name: Check PR Author
        run: |
          ALLOWED_USERS="Phonesavang"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          
          if [[ " $ALLOWED_USERS " =~ " $PR_AUTHOR " ]]; then
            echo "✅ PR author ($PR_AUTHOR) is authorized"
          else
            echo "⚠️  PR author ($PR_AUTHOR) requires approval from repository owner"
            echo "This PR needs review from @Phonesavang before merging"
          fi
